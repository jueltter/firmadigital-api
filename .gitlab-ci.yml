workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^((\d+\.\d+\.\d+)|latest)$/'
    - when: never

stages:
  - build
  - deploy

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "$REGISTRY_DOMAIN/development/firmaec/firmadigital-api/firmadigital-api"


build_and_push:
  stage: build
  image: docker:29.6.0-cli
  services:
    - name: docker:29.6.0-dind
  tags:
    - shared
  before_script:
    - apk add --no-cache ca-certificates
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export EXT_REPOSITORY_READ_TOKEN="$EXT_REPOSITORY_READ_TOKEN"
    - docker build --provenance=false --platform linux/amd64 --build-arg MAIN_DOMAIN_ARG=$MAIN_DOMAIN --secret id=ext-repository-read-token,env=EXT_REPOSITORY_READ_TOKEN -t "$IMAGE_NAME:$CI_COMMIT_TAG" .
    - docker push $IMAGE_NAME:$CI_COMMIT_TAG

.ssh_deploy_template: &ssh_setup
  image: alpine:3.19
  tags:
    - shared
  before_script:
    - set -euo pipefail
    # Install SSH client
    - apk add --no-cache openssh-client gettext util-linux
    # Start SSH agent and load the private key variable securely
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    # Create the secure .ssh directory and disable strict host checking for automation
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

deploy_to_test:
  stage: deploy
  <<: *ssh_setup
  environment:
    name: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    - set -euo pipefail
    - RANDOM_ID=$(uuidgen)
    # Export GitLab CI variables so envsubst can access them
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$CI_COMMIT_TAG

    - export WILDFLY_USER=$WILDFLY_USER
    - export WILDFLY_PASS=$WILDFLY_PASS

    # Now envsubst will replace ${VARIABLE} with exported values
    - envsubst < .gitlab-ci/firmadigital-api.container.template > firmadigital-api.container.tmp
    - envsubst < .gitlab-ci/firmadigital-api.env.template > firmadigital-api.env.tmp

    # Copy substituted files to test server
    - scp firmadigital-api.container.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-api-$RANDOM_ID.container
    - scp firmadigital-api.env.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-api-$RANDOM_ID.env
    # Execute commands remotely on your Test server via SSH
    - |
      ssh sdlc-bot@$CONTAINER_HOST "
        systemctl --user disable firmadigital-api --now || true &&
        mkdir -p ~/.config/containers/systemd/firmadigital-api || true &&
        cp /tmp/firmadigital-api-$RANDOM_ID.container /home/sdlc-bot/.config/containers/systemd/firmadigital-api.container &&
        cp /tmp/firmadigital-api-$RANDOM_ID.env /home/sdlc-bot/.config/containers/systemd/firmadigital-api/.env &&
        podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        podman pull $IMAGE_NAME:$CI_COMMIT_TAG &&
        systemctl --user daemon-reload &&
        systemctl --user start firmadigital-api
      "
deploy_to_prod:
  stage: deploy
  <<: *ssh_setup
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  when: manual
  script:
    - set -euo pipefail
    - RANDOM_ID=$(uuidgen)
    # Export GitLab CI variables so envsubst can access them
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$CI_COMMIT_TAG

    - export WILDFLY_USER=$WILDFLY_USER
    - export WILDFLY_PASS=$WILDFLY_PASS

    # Now envsubst will replace ${VARIABLE} with exported values
    - envsubst < .gitlab-ci/firmadigital-api.container.template > firmadigital-api.container.tmp
    - envsubst < .gitlab-ci/firmadigital-api.env.template > firmadigital-api.env.tmp

    # Copy substituted files to test server
    - scp firmadigital-api.container.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-api-$RANDOM_ID.container
    - scp firmadigital-api.env.tmp sdlc-bot@$CONTAINER_HOST:/tmp/firmadigital-api-$RANDOM_ID.env
    # Execute commands remotely on your Test server via SSH
    - |
      ssh sdlc-bot@$CONTAINER_HOST "
        systemctl --user disable firmadigital-api --now || true &&
        mkdir -p ~/.config/containers/systemd/firmadigital-api || true &&
        cp /tmp/firmadigital-api-$RANDOM_ID.container /home/sdlc-bot/.config/containers/systemd/firmadigital-api.container &&
        cp /tmp/firmadigital-api-$RANDOM_ID.env /home/sdlc-bot/.config/containers/systemd/firmadigital-api/.env &&
        podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        podman pull $IMAGE_NAME:$CI_COMMIT_TAG &&
        systemctl --user daemon-reload &&
        systemctl --user start firmadigital-api
      "