workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^((\d{4}-(DEV|PROD))|latest)$/'
    - when: never

stages:
  - build

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "$REGISTRY_DOMAIN/development/firmaec/firmadigital-api/firmadigital-api"


build_and_push:
  stage: build
  image: docker:29.6.0-cli
  services:
    - name: docker:29.6.0-dind
  tags:
    - shared
  before_script:
    - apk add --no-cache ca-certificates
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export EXT_REPOSITORY_READ_TOKEN="$EXT_REPOSITORY_READ_TOKEN"
    - docker build --provenance=false --platform linux/amd64 --build-arg MAIN_DOMAIN_ARG=$MAIN_DOMAIN --secret id=ext-repository-read-token,env=EXT_REPOSITORY_READ_TOKEN -t "$IMAGE_NAME:$CI_COMMIT_TAG" .
    - docker push $IMAGE_NAME:$CI_COMMIT_TAG